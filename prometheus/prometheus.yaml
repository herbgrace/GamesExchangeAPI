global:
  scrape_interval: 15s 

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['Prometheus:9090']
        labels:
          group: 'prometheus'

  - job_name: 'api'
    static_configs:
      - targets: ['videogameexchange-api-1:7156', 'videogameexchange-api-2:7156']
        labels:
          group: 'exchange-api'
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: '(.*)'
        target_label: __name__
        replacement: 'api_${1}'

  - job_name: 'mysql'
    static_configs:
      - targets: ['DBExporter:9104']
        labels:
          group: 'mysql'
  
  - job_name: 'kafka'
    static_configs:
      - targets: ['KafkaExporter:9308']
        labels:
          group: 'kafka'

  - job_name: 'nginx'
    static_configs:
      - targets: ['NginxExporter:9113']
        labels:
          group: 'nginx'

  - job_name: 'email-service'
    static_configs:
      - targets: ['EmailService:7001']
        labels:
          group: 'email-service'