global:
  scrape_interval: 15s 

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['Prometheus:9090']
        labels:
          group: 'prometheus'

  - job_name: 'api'
    static_configs:
      - targets: ['videogameexchange-api-1:7156', 'videogameexchange-api-2:7156']
        labels:
          group: 'exchange-api'

  - job_name: 'mysql'
    static_configs:
      - targets: ['DBExporter:9104']
        labels:
          group: 'mysql'

